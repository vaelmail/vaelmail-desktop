<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VaelMail Setup</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="welcome">
    <aside class="art" data-tauri-drag-region>
      <div class="art-image" data-tauri-drag-region></div>
      <div class="art-foot" data-tauri-drag-region>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 16h10l14 32H28z" fill="#b9d778" />
          <path d="M40 16h10L36 48H26z" fill="#e6e9dc" />
        </svg>
        <span class="art-name">VaelMail</span>
        <span class="art-version" id="version"></span>
      </div>
    </aside>

    <main class="panel">
      <header class="bar" data-tauri-drag-region>
        <span class="bar-title" data-tauri-drag-region>Setup</span>
        <button type="button" class="win" id="minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" /></svg>
        </button>
        <button type="button" class="win close" id="close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5l9 9M9.5.5l-9 9" /></svg>
        </button>
      </header>

      <section class="page" id="page-welcome" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Install VaelMail</h1>
        <p class="lead" id="lead"></p>

        <dl class="facts">
          <div id="location-row">
            <dt>Location</dt>
            <dd class="path">
              <span id="location"></span>
              <button type="button" class="link" id="choose">Change</button>
            </dd>
          </div>
          <div>
            <dt>Download size</dt>
            <dd id="size"></dd>
          </div>
          <div>
            <dt>Updates</dt>
            <dd>Installed automatically after you confirm them in the app</dd>
          </div>
        </dl>

        <fieldset class="options">
          <legend class="sr-only">Options</legend>
          <label id="desktop-row"
            ><input type="checkbox" id="desktop" checked /> Desktop shortcut</label
          >
          <label id="autostart-row"
            ><input type="checkbox" id="autostart" /> Open VaelMail when I sign in to this
            computer</label
          >
          <label
            ><input type="checkbox" id="launch" checked /> Open VaelMail when setup is done</label
          >
        </fieldset>

        <footer class="actions">
          <button type="button" class="link" id="remove" hidden>Remove VaelMail</button>
          <span class="spacer"></span>
          <button type="button" class="button" id="cancel">Cancel</button>
          <button type="button" class="button primary" id="install">Install</button>
        </footer>
      </section>

      <section class="page" id="page-progress" aria-labelledby="progress-title">
        <h1 id="progress-title">Installing VaelMail</h1>
        <p class="lead" id="progress-lead">This takes a few seconds.</p>
        <div
          class="meter"
          role="progressbar"
          aria-labelledby="progress-title"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="meter-box"
        >
          <i id="meter"></i>
        </div>
        <p class="status">
          <span id="status" aria-live="polite">Preparing</span><span id="percent">0%</span>
        </p>
      </section>

      <section class="page" id="page-done" aria-labelledby="done-title">
        <h1 id="done-title">VaelMail is installed</h1>
        <p class="lead" id="done-text"></p>
        <footer class="actions">
          <span class="spacer"></span>
          <button type="button" class="button" id="finish">Close</button>
          <button type="button" class="button primary" id="open">Open VaelMail</button>
        </footer>
      </section>

      <section class="page" id="page-error" aria-labelledby="error-title">
        <h1 id="error-title">Setup couldn't finish</h1>
        <p class="lead" id="error-text"></p>
        <footer class="actions">
          <button type="button" class="link" id="fallback" hidden>
            Use the classic installer instead
          </button>
          <span class="spacer"></span>
          <button type="button" class="button" id="give-up">Close</button>
          <button type="button" class="button primary" id="retry">Try again</button>
        </footer>
      </section>
    </main>
  </body>
</html>
