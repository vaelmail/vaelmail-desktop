name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: ""
          - name: Windows arm64
            platform: windows-11-arm
            target: ""
          - name: macOS Apple silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            target: ""
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev libsecret-1-dev
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAEL_UPDATER_PUBKEY: ${{ vars.VAEL_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: VaelMail __VERSION__
          releaseBody: See the assets below to download VaelMail for Windows, macOS or Linux.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Package and upload the portable build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="$(node scripts/package-portable.mjs "${{ matrix.target }}" | tail -n 1)"
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" "$archive" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add download names without the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          mkdir assets && cd assets
          while IFS='|' read -r source alias; do
            gh release download "v${version}" --pattern "$source" --output "$alias"
          done <<EOF
          VaelMail_${version}_x64-setup.exe|VaelMail-windows-x64-setup.exe
          VaelMail_${version}_arm64-setup.exe|VaelMail-windows-arm64-setup.exe
          VaelMail_${version}_windows-x64-portable.zip|VaelMail-windows-x64-portable.zip
          VaelMail_${version}_windows-arm64-portable.zip|VaelMail-windows-arm64-portable.zip
          VaelMail_${version}_aarch64.dmg|VaelMail-macos-apple-silicon.dmg
          VaelMail_${version}_x64.dmg|VaelMail-macos-intel.dmg
          VaelMail_${version}_macos-aarch64-portable.zip|VaelMail-macos-apple-silicon-portable.zip
          VaelMail_${version}_macos-x64-portable.zip|VaelMail-macos-intel-portable.zip
          VaelMail_${version}_amd64.AppImage|VaelMail-linux-x64.AppImage
          VaelMail_${version}_amd64.deb|VaelMail-linux-x64.deb
          VaelMail-${version}-1.x86_64.rpm|VaelMail-linux-x64.rpm
          VaelMail_${version}_linux-amd64-portable.tar.gz|VaelMail-linux-x64-portable.tar.gz
          VaelMail_${version}_aarch64.AppImage|VaelMail-linux-arm64.AppImage
          VaelMail_${version}_arm64.deb|VaelMail-linux-arm64.deb
          VaelMail-${version}-1.aarch64.rpm|VaelMail-linux-arm64.rpm
          VaelMail_${version}_linux-aarch64-portable.tar.gz|VaelMail-linux-arm64-portable.tar.gz
          EOF
          gh release upload "v${version}" VaelMail-* --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          gh release edit "v${version}" --draft=false --latest
